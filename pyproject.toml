[project]
name = "routeforge-ai"
version = "0.1.0"
description = "Local-first route planning and optimization application."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112",
    "ortools>=9.10,<9.15",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
